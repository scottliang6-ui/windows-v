
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniCast - Cyber Blue Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #121212;
          color: #FFFFFF;
        }
        code { font-family: 'Fira Code', monospace; }
        
        .cyber-blue-glow {
          box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }
        
        .cyber-card {
          background: #1e1e1e;
          border: 1px solid #2d2d30;
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .cyber-card:hover {
          background: #252528;
          border-color: #00e5ff;
          box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
          transform: translateY(-2px);
        }

        @keyframes breathe {
          0%, 100% { 
            box-shadow: 0 0 10px rgba(255, 61, 0, 0.4); 
            transform: scale(1);
          }
          50% { 
            box-shadow: 0 0 25px rgba(255, 61, 0, 0.8); 
            transform: scale(1.05);
          }
        }

        .animate-breathe {
          animation: breathe 2s infinite ease-in-out;
        }

        .glass-header {
          background: rgba(30, 30, 30, 0.8);
          backdrop-filter: blur(10px);
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="overflow-hidden selection:bg-cyan-500/30">
    <div id="root"></div>
</body>
</html>
